[project]
name = "research-assistant-backend"
version = "2.0.0"
description = "LangGraph multi-agent research service (FastAPI + SSE)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "langchain>=1.0",
    "langchain-tavily>=0.2.5",
    "langchain-groq>=0.3",
    "langchain-ollama>=0.3",
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
